name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qronge
          POSTGRES_PASSWORD: qronge-test
          POSTGRES_DB: qronge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qronge -d qronge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://qronge:qronge-test@localhost:5432/qronge_test
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build Docker image
        run: docker build -t qronge-appplatform-check .
